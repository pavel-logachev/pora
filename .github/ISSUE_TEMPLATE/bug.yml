name: Ошибка
description: Напоминание не пришло, данные отображаются неверно или приложение ведёт себя неправильно
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Уберите из скриншотов и журналов названия лекарств, адреса почты, код восстановления и токены.
  - type: input
    id: version
    attributes:
      label: Версия приложения
      placeholder: 1.1.0 (6)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и версия Android
      description: Модель, версия Android и оболочка производителя
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
  - type: checkboxes
    id: conditions
    attributes:
      label: Если пропущено напоминание
      options:
        - label: Точные будильники разрешены
        - label: Приложение исключено из ограничений батареи
        - label: Телефон перезагружался после создания курса
